<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel='icon' href='../Static/images/APPlogo.png'>
  <title>Login - Crazy-Musics</title>
  <link rel='stylesheet' href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'>
  <link rel='stylesheet' href='https://fonts.googleapis.com/css2?family=Poppins&amp;display=swap'>
  <link rel="stylesheet" href="../Static/Login.css">
</head>

<body>
  <div class="BackButton" id="BacktoMain">
    <img src="../Static/images/icons8-left.gif">
    <button>Back to Main</button>
  </div>
  <div class="wrapper">
    <div class="login_box">
      <div class="login-header">
        <img src="../Static/images/APPlogo.png" class="login-logo" alt="Logo">
        <span>Login</span>
      </div>

      <div class="input_box">
        <input type="email" id="email" placeholder=" " class="input-field" required>
        <label for="user" class="label">Email</label>
        <i class="bx bx-envelope icon"></i>
      </div>

      <div class="input_box">
        <input type="password" id="pass" placeholder=" " class="input-field" required>
        <label for="pass" class="label">Password</label>
        <i class="bx bx-lock-alt icon"></i>
        <i class="bx bx-show password-toggle" id="togglePassword"></i>
      </div>
      
      <div id="errorMessage" class="error-message"></div>

      <div class="remember-forgot">
        <div class="remember-me">
          <input type="checkbox" id="remember">
          <label class="reminder" for="remember">Remember me</label>
        </div>

        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>
      </div>

      <div class="input_box" style="position: relative;">
        <input id="submitBtn" type="submit" class="input-submit" value="Login" disabled>
        <img id="submitIcon" src="../Static/images/icons8-circled-right.gif" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px; display: none;" alt="">
      </div>

      <div class="trust-text">
        <i class='bx bxs-lock-alt'></i> Your details are safe with us
      </div>

      <div class="divider">
        <span>or</span>
      </div>

      <div class="social-login">
        <button class="social-btn google-btn" id="googleLogin">
          <svg width="20" height="20" viewBox="0 0 20 20">
            <path fill="#4285F4" d="M19.6 10.23c0-.82-.1-1.42-.25-2.05H10v3.72h5.5c-.15.96-.74 2.31-2.04 3.22v2.45h3.16c1.89-1.73 2.98-4.3 2.98-7.34z"/>
            <path fill="#34A853" d="M13.46 15.13c-.83.59-1.96 1-3.46 1-2.64 0-4.88-1.74-5.68-4.15H1.07v2.52C2.72 17.75 6.09 20 10 20c2.7 0 4.96-.89 6.62-2.42l-3.16-2.45z"/>
            <path fill="#FBBC05" d="M3.99 10c0-.69.12-1.35.32-1.97V5.51H1.07A9.973 9.973 0 000 10c0 1.61.39 3.14 1.07 4.49l3.24-2.52c-.2-.62-.32-1.28-.32-1.97z"/>
            <path fill="#EA4335" d="M10 3.88c1.88 0 3.13.81 3.85 1.48l2.84-2.76C14.96.99 12.7 0 10 0 6.09 0 2.72 2.25 1.07 5.51l3.24 2.52C5.12 5.62 7.36 3.88 10 3.88z"/>
          </svg>
          Continue with Google
        </button>
        <button class="social-btn apple-btn" id="appleLogin">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="white">
            <path d="M15.5 9.5c0-1.8 1.5-2.7 1.6-2.8-1-1.4-2.4-1.6-2.9-1.6-1.2-.1-2.4.7-3.1.7-.6 0-1.7-.7-2.8-.7C6.1 5.2 4 6.9 4 10.4c0 1.5.6 3.1 1.3 4.1.6.9 1.1 1.5 1.9 1.5.8 0 1.1-.5 2.1-.5 1 0 1.2.5 2.1.5.9 0 1.4-.7 1.9-1.5.6-.9.8-1.7.8-1.8 0 0-1.7-.6-1.7-2.4.1-1.5 1.2-2.2 1.1-2.3zm-1.8-5.3c.5-.6.9-1.5.8-2.4-.8 0-1.7.5-2.3 1.2-.5.5-.9 1.4-.8 2.2.9.1 1.8-.4 2.3-1z"/>
          </svg>
          Continue with Apple
        </button>
      </div>

      <div class="register">
        <span>Don't have an account? <a href="./RegisterPage.html">Register</a></span>
      </div>
    </div>
  </div>
  <div id="toast"></div>

  <script>
    // Check if user is already logged in
    const token = localStorage.getItem('token');
    if (token) {
      // User is already logged in, redirect to home
      window.location.href = '../../index.html';
    }

    // Page fade-in animation
    document.addEventListener('DOMContentLoaded', () => {
      document.body.style.opacity = '0';
      setTimeout(() => {
        document.body.style.transition = 'opacity 0.4s ease-in';
        document.body.style.opacity = '1';
      }, 10);
    });

    // Password toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('pass');
    
    togglePassword.addEventListener('click', () => {
      const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordField.setAttribute('type', type);
      togglePassword.classList.toggle('bx-show');
      togglePassword.classList.toggle('bx-hide');
    });

    // Error message display
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.style.display = 'block';
      setTimeout(() => {
        errorDiv.style.display = 'none';
      }, 4000);
    }

    // ---------------Toast message--------------------
    function showToast(message, type = 'info') {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.backgroundColor = type === 'error' ? '#dc3545' : type === 'success' ? '#28a745' : '#333';
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    // Social login placeholders
    document.getElementById('googleLogin').addEventListener('click', () => {
      showToast('Google Sign-In coming soon! 🎵', 'info');
    });

    document.getElementById('appleLogin').addEventListener('click', () => {
      showToast('Apple Sign-In coming soon! 🎵', 'info');
    });

    // --------------------------------------------------------
    let ReminderEl = document.getElementById('remember');
    let ButtonEl = document.getElementById('submitBtn');
    
    ButtonEl.addEventListener('click', async () => {
      let emailEl = document.getElementById('email');
      let passEl = document.getElementById('pass');

      if (emailEl.value === '' || passEl.value === '') {
        showError('⚠️ All fields are required');
        showToast('All inputs are required', 'error');
        return;
      }

      // Email validation
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(emailEl.value)) {
        showError('⚠️ Please enter a valid email address');
        showToast('Invalid email format', 'error');
        return;
      }

      try {
        ButtonEl.disabled = true;
        ButtonEl.value = 'Logging in...';
        
        const res = await fetch('https://crazy-musics-1.onrender.com/login', {
          method: 'POST',
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: emailEl.value,
            pass: passEl.value
          })
        });

        const data = await res.json();

        if (!res.ok) {
          ButtonEl.disabled = false;
          ButtonEl.value = 'Login';
          
          // Specific error messages
          if (res.status === 404) {
            showError('❌ Account not found. Please sign up first.');
            showToast('Account not found', 'error');
          } else if (res.status === 401) {
            showError('❌ Incorrect password. Please try again.');
            showToast('Wrong password', 'error');
          } else {
            showError('⚠️ ' + (data.message || 'Server error. Please try again later.'));
            showToast(data.message || 'Server Error', 'error');
          }
          return;
        }

        // Store token
        localStorage.setItem('token', data.token);
        localStorage.setItem('userEmail', data.email);

        showToast('Login Successful! 🎉 Redirecting...', 'success');
        ButtonEl.value = 'Success!';

        // Redirect to Home page after 1.5 seconds
        setTimeout(() => {
          window.location.href = '../../index.html';
        }, 1500);

      } catch (err) {
        ButtonEl.disabled = false;
        ButtonEl.value = 'Login';
        showError('🌐 Network error. Please check your connection.');
        showToast('Network Error. Please try again', 'error');
      }
    });

    // --------- checkbox event-----------------
    let submitIcon = document.getElementById('submitIcon');
    ReminderEl.addEventListener('change', () => {
      if (ReminderEl.checked) {
        ButtonEl.disabled = false;
        ButtonEl.classList.remove('disabled');
        submitIcon.style.display = 'block';
      } else {
        ButtonEl.disabled = true;
        ButtonEl.classList.add('disabled');
        submitIcon.style.display = 'none';
      }
    });

    let valueBack = document.getElementById('BacktoMain');
    valueBack.addEventListener('click', () => {
      window.location.href = "./index.html";
    });
  </script>


</body>

</html>
