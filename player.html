<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Now Playing - Crazy Musics</title>
  <link rel="icon" href="Forentend/Static/images/APPlogo.png" />
  <link rel="stylesheet" href="player.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
</head>
<body>
  <div id="particles-container"></div>
  
  <div class="player-container">
    <!-- Back Button -->
    <a href="index.html" class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      <span>Back to Home</span>
    </a>

    <!-- Album Art Carousel -->
    <div class="carousel-section">
      <button class="carousel-arrow left" id="prevBtn">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
        </svg>
      </button>

      <div class="album-carousel">
        <div class="album-art prev" id="prevAlbum">
          <img src="" alt="Previous track" />
        </div>
        <div class="album-art current" id="currentAlbum">
          <img src="" alt="Current track" />
          <div class="now-playing-badge">NOW PLAYING</div>
        </div>
        <div class="album-art next" id="nextAlbum">
          <img src="" alt="Next track" />
        </div>
      </div>

      <button class="carousel-arrow right" id="nextBtn">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/>
        </svg>
      </button>
    </div>

    <!-- Track Info -->
    <div class="track-info">
      <h1 id="trackName">Loading...</h1>
      <p id="artistName">Please wait</p>
    </div>

    <!-- Player Controls (Fixed Bottom) -->
    <div class="player-controls">
      <div class="progress-section">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
          <input type="range" class="progress-slider" id="progressSlider" min="0" max="100" value="0" />
        </div>
        <span class="time" id="duration">0:00</span>
      </div>

      <div class="controls-buttons">
        <button class="control-btn" id="prevTrackBtn" title="Previous track">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>

        <button class="control-btn play-pause" id="playPauseBtn" title="Play/Pause">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" id="playIcon">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" id="pauseIcon" style="display: none;">
            <path d="M6 4h4v16H6V4zm8 0h4v16h-4V4z"/>
          </svg>
        </button>

        <button class="control-btn" id="nextTrackBtn" title="Next track">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>

      <div class="volume-section">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" />
      </div>
    </div>
  </div>

  <script src="Forentend/Static/particles.js"></script>
  <script src="player.js"></script>
</body>
</html>
